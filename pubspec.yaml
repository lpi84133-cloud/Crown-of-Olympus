name: crownofolympus
description: "Crown of Olympus - a foggy Greek labyrinth adventure."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "assets/icon.png"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/hero.webp
    - assets/wall.webp
    - assets/tail.webp
    - assets/crown.webp
    - assets/entrance.webp
    - assets/torch.webp
    - assets/fogGreek.webp
    - assets/bggreek.webp
    - assets/bg21greek.webp
    - assets/logogGreek.webp
    - assets/horizontalload.webp
    - assets/verticalload.webp
    - assets/icon.png
